name: Patch v2.0.2 release gate

on:
  push:
    branches: [agent/fix-v2.0.2-release-gate]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-gate-patched]') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-v2.0.2-release-gate
          fetch-depth: 0
      - name: Update regression contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tests/test_interface_details.py"
          $text = [IO.File]::ReadAllText($path)
          $old = 'self.assertIn("grid-template-columns: repeat(5, minmax(0, 1fr));", self.styles)'
          $new = 'self.assertIn("grid-template-columns: repeat(6, minmax(0, 1fr));", self.styles)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one mobile navigation assertion, found $count." }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          git rm .github/workflows/agent-fix-release-gate.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_interface_details.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test: update mobile navigation contract [release-gate-patched]"
          git push origin HEAD:agent/fix-v2.0.2-release-gate
