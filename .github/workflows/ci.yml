name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_WINDOWS_X64_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e

jobs:
  windows-quality:
    name: Windows quality and security
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout canonical source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Prepare pinned Windows quality tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $env:GOBIN = Join-Path $env:RUNNER_TEMP "go-tools"
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "GOBIN=$env:GOBIN" + [Environment]::NewLine, $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_PATH, $env:GOBIN + [Environment]::NewLine, $utf8NoBom)

          $toolRoot = Join-Path $env:LOCALAPPDATA "IrisOnlineDatabase\BuildTools"
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $auditEnv = Join-Path $toolRoot "python-audit"
          Remove-Item -LiteralPath $auditEnv -Recurse -Force -ErrorAction SilentlyContinue
          python -m venv $auditEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $auditPython = Join-Path $auditEnv "Scripts\python.exe"
          & $auditPython -m pip install --disable-pip-version-check --requirement tools\requirements-audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $auditPython -B tools\verify_python_environment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $auditPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath (Join-Path $toolRoot "python-audit-active.txt") -Value $auditEnv -Encoding UTF8
          [IO.File]::AppendAllText($env:GITHUB_PATH, (Join-Path $auditEnv "Scripts") + [Environment]::NewLine, $utf8NoBom)

          $playwrightPath = Join-Path $toolRoot "playwright"
          New-Item -ItemType Directory -Force -Path $playwrightPath | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $playwrightPath
          & $auditPython -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PLAYWRIGHT_BROWSERS_PATH=$playwrightPath" + [Environment]::NewLine, $utf8NoBom)

          $archiveName = "gitleaks_$env:GITLEAKS_VERSION`_windows_x64.zip"
          $checksumsName = "gitleaks_$env:GITLEAKS_VERSION`_checksums.txt"
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksums = Join-Path $env:RUNNER_TEMP $checksumsName
          Invoke-WebRequest -UseBasicParsing -Uri "$base/$archiveName" -OutFile $archive
          Invoke-WebRequest -UseBasicParsing -Uri "$base/$checksumsName" -OutFile $checksums
          $expectedLine = Get-Content -LiteralPath $checksums | Where-Object { $_ -match [Regex]::Escape($archiveName) } | Select-Object -First 1
          if (-not $expectedLine) { throw "Official Gitleaks checksum is missing." }
          $expected = ($expectedLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $env:GITLEAKS_WINDOWS_X64_SHA256 -or $actual -ne $expected) {
            throw "Pinned Gitleaks checksum verification failed."
          }
          $gitleaksDir = Join-Path $toolRoot "gitleaks-$env:GITLEAKS_VERSION"
          Remove-Item -LiteralPath $gitleaksDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $gitleaksDir -Force
          $gitleaks = Join-Path $gitleaksDir "gitleaks.exe"
          if ((& $gitleaks version | Out-String).Trim() -ne $env:GITLEAKS_VERSION) {
            throw "Pinned Gitleaks executable version mismatch."
          }

      - name: Run canonical Windows release gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.filemode false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # GitHub pull-request checkouts may be detached. The local ref name is
          # normalized only inside this disposable runner; the commit is unchanged.
          git checkout -B main HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\IrisTools.ps1 -Action Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-race:
    name: Windows race detector
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Windows amd64 race detector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gcc = Get-Command gcc.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "Windows race detector requires gcc.exe on the GitHub runner." }
          & $gcc.Source --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $syncArchive = (& $gcc.Source -print-file-name=libsynchronization.a | Out-String).Trim()
          if (-not $syncArchive -or $syncArchive -eq "libsynchronization.a" -or -not (Test-Path -LiteralPath $syncArchive -PathType Leaf)) {
            throw "Windows MinGW runtime is too old for the Go race detector."
          }
          $env:CGO_ENABLED = "1"
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-build:
    name: Native Windows Wails release matrix
    runs-on: windows-2025
    needs: [windows-quality, windows-race]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Install pinned Windows release Go tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RUNNER_TEMP) { throw "RUNNER_TEMP is unavailable." }
          $env:GOBIN = Join-Path $env:RUNNER_TEMP "go-tools"
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "GOBIN=$env:GOBIN" + [Environment]::NewLine, $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_PATH, $env:GOBIN + [Environment]::NewLine, $utf8NoBom)

      - name: Parse and self-test Windows PowerShell 5.1 tooling
        shell: powershell
        run: |
          $files = @("IrisTools.ps1", "scripts\windows\IrisTools.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              Write-Host "PowerShell syntax: FAIL [PS_PARSE] file=$file count=$($errors.Count)"
              exit 1
            }
          }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\IrisTools.ps1 -Action SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Go tests
        shell: powershell
        run: |
          $driveRoot = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $testTemp = Join-Path $driveRoot ("iris-go-test-temp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $oldTemp = $env:TEMP
          $oldTmp = $env:TMP
          $oldTmpDir = $env:TMPDIR
          $goTestExitCode = 0
          try {
            $env:TEMP = $testTemp
            $env:TMP = $testTemp
            $env:TMPDIR = $testTemp
            go test -count=1 ./...
            $goTestExitCode = $LASTEXITCODE
          } finally {
            $env:TEMP = $oldTemp
            $env:TMP = $oldTmp
            $env:TMPDIR = $oldTmpDir
            Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($goTestExitCode -ne 0) { exit $goTestExitCode }

      - name: Build production desktop executables and SHA256 (x64, x86, arm64)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactDir = Join-Path $env:RUNNER_TEMP "iris-release-multiarch"
          Remove-Item -LiteralPath $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $wails = Join-Path $env:GOBIN "wails.exe"
          if (-not (Test-Path -LiteralPath $wails -PathType Leaf)) { throw "Pinned Wails executable is missing." }
          $targets = @(
            [pscustomobject]@{ Platform = "windows/amd64"; Suffix = "x64"; LevelName = "GOAMD64"; LevelValue = "v1" },
            [pscustomobject]@{ Platform = "windows/386"; Suffix = "x86"; LevelName = "GO386"; LevelValue = "sse2" },
            [pscustomobject]@{ Platform = "windows/arm64"; Suffix = "arm64"; LevelName = "GOARM64"; LevelValue = "v8.0" }
          )
          $environmentNames = @("CGO_ENABLED", "GOAMD64", "GO386", "GOARM64")
          $savedEnvironment = @{}
          foreach ($name in $environmentNames) {
            $savedEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, "Process")
          }
          $artifacts = New-Object System.Collections.Generic.List[string]
          try {
            foreach ($target in $targets) {
              Remove-Item Env:\GOAMD64 -ErrorAction SilentlyContinue
              Remove-Item Env:\GO386 -ErrorAction SilentlyContinue
              Remove-Item Env:\GOARM64 -ErrorAction SilentlyContinue
              $env:CGO_ENABLED = "0"
              Set-Item -Path "Env:$($target.LevelName)" -Value $target.LevelValue
              & $wails build -platform $target.Platform -webview2 embed -trimpath -clean -skipbindings -s -nosyncgomod -m -o IrisOnlineDatabase.exe -ldflags "-buildid= -X main.appVersion=$version -X main.releaseMarker=IrisOnlineRelease/$version/$head"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $artifact = Join-Path $artifactDir "IrisOnlineDB-$version-Windows-$($target.Suffix).exe"
              Copy-Item build\bin\IrisOnlineDatabase.exe $artifact -Force
              $artifacts.Add($artifact)
            }
          } finally {
            foreach ($name in $environmentNames) {
              $value = $savedEnvironment[$name]
              if ($null -eq $value) {
                Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
              } else {
                Set-Item -Path "Env:$name" -Value $value
              }
            }
            Remove-Item build\bin, build\generated, web\wailsjs -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item build\appicon.png -Force -ErrorAction SilentlyContinue
          }
          $checksumLines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $artifact -Leaf)"
          }
          Set-Content -LiteralPath (Join-Path $artifactDir "SHA256SUMS.txt") -Value $checksumLines -Encoding ASCII
          python -B tools/verify_release_assets.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/verify_executables.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/verify_windows_resources.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source tree remains clean
        shell: powershell
        run: |
          python -B tools/repository_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.Count -ne 0) {
            $status | ForEach-Object { Write-Host $_ }
            exit 1
          }
