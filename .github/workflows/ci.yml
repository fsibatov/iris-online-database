name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  quality:
    name: Linux quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned Go quality tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-tools"
          echo "$RUNNER_TEMP/go-tools" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/go-tools" timeout 8m go install honnef.co/go/tools/cmd/staticcheck@2026.1
          GOBIN="$RUNNER_TEMP/go-tools" timeout 8m go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Create cached Python audit environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/python-audit"
          for attempt in 1 2 3; do
            if timeout 8m "$RUNNER_TEMP/python-audit/bin/python" -m pip install --disable-pip-version-check -r tools/requirements-audit.txt; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Validate exact Python audit environment
        shell: bash
        run: |
          "$RUNNER_TEMP/python-audit/bin/python" -B tools/verify_python_environment.py
          "$RUNNER_TEMP/python-audit/bin/python" -m pip check

      - name: Validate GitHub workflow syntax and action pins
        run: |
          "$RUNNER_TEMP/python-audit/bin/python" -B tools/validate_workflows.py

      - name: Install Playwright Chromium outside source
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: timeout 12m "$RUNNER_TEMP/python-audit/bin/python" -m playwright install --with-deps chromium

      - name: Install official Gitleaks binary with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = "$GITLEAKS_VERSION"
          probe_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-probe.XXXXXXXX")"
          printf 'token=%s%s\n' 'ghp_' 'wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS' > "$probe_dir/probe.txt"
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --no-banner --redact --exit-code 37 "$probe_dir" >/dev/null 2>&1
          probe_exit=$?
          set -e
          rm -rf -- "$probe_dir"
          test "$probe_exit" -eq 37
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Repository audit before checks
        run: python -B tools/repository_audit.py

      - name: Go format and module integrity
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l -- *.go)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          go mod verify
          go mod tidy -diff
          go list -deps ./... > "$RUNNER_TEMP/go-dependencies.txt"

      - name: Go build, unit tests and vet
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m go build -trimpath -o "$RUNNER_TEMP/iris-build-probe" .
          timeout 15m go test -count=1 ./...
          timeout 10m go vet ./...

      - name: Staticcheck
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 timeout 15m staticcheck ./...

      - name: Govulncheck
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/release-tools.sh
          iris_run_govulncheck "$(command -v govulncheck)" 15m

      - name: Python compile and regression tests
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python -m compileall -q tools
          timeout 10m "$RUNNER_TEMP/python-audit/bin/python" -B -m unittest discover -s tools -p 'test_*.py'

      - name: Ruff lint and formatting
        shell: bash
        run: |
          "$RUNNER_TEMP/python-audit/bin/ruff" check --no-cache .
          "$RUNNER_TEMP/python-audit/bin/ruff" format --check --no-cache .

      - name: Bandit
        run: |
          "$RUNNER_TEMP/python-audit/bin/bandit" -q -r tools -x 'tools/test_*.py'

      - name: Full installed-environment dependency audit
        run: timeout 10m "$RUNNER_TEMP/python-audit/bin/pip-audit" --local --cache-dir "$RUNNER_TEMP/pip-audit-cache"

      - name: Embedded data integrity audit
        shell: bash
        run: |
          python -B tools/data_presentation_audit.py

      - name: Frontend syntax and deterministic Chromium smoke
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          node --check web/app.js
          timeout 10m "$RUNNER_TEMP/python-audit/bin/python" -B tools/frontend_smoke_test.py

      - name: Gitleaks current source
        run: timeout 10m gitleaks dir --no-banner --redact .

      - name: Gitleaks complete Git history
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gitleaks-history.log"
          set +e
          timeout 10m gitleaks git --no-banner --redact --log-level info . >"$output" 2>&1
          exit_code=$?
          set -e
          cat "$output"
          test "$exit_code" -eq 0
          grep -Eq '[1-9][0-9]* commits scanned\.' "$output"

      - name: Source tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/repository_audit.py
          git diff --exit-code
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status"

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Race detector
        run: timeout 20m go test -race -count=1 ./...

  windows-build:
    name: Native Windows Wails release matrix
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GOBIN: ${{ runner.temp }}\go-tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Install pinned Windows release Go tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, $env:GOBIN + [Environment]::NewLine, $utf8NoBom)

      - name: Parse and self-test Windows PowerShell 5.1 tooling
        shell: powershell
        run: |
          $files = @("IrisTools.ps1", "scripts\windows\IrisTools.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              Write-Host "PowerShell syntax: FAIL [PS_PARSE] file=$file count=$($errors.Count)"
              exit 1
            }
          }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\IrisTools.ps1 -Action SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Go tests
        shell: powershell
        run: |
          $driveRoot = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $testTemp = Join-Path $driveRoot ("iris-go-test-temp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $oldTemp = $env:TEMP
          $oldTmp = $env:TMP
          $oldTmpDir = $env:TMPDIR
          $goTestExitCode = 0
          try {
            $env:TEMP = $testTemp
            $env:TMP = $testTemp
            $env:TMPDIR = $testTemp
            go test -count=1 ./...
            $goTestExitCode = $LASTEXITCODE
          } finally {
            $env:TEMP = $oldTemp
            $env:TMP = $oldTmp
            $env:TMPDIR = $oldTmpDir
            Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($goTestExitCode -ne 0) { exit $goTestExitCode }

      - name: Build production desktop executables and SHA256 (x64, x86, arm64)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactDir = Join-Path $env:RUNNER_TEMP "iris-release-multiarch"
          Remove-Item -LiteralPath $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $wails = Join-Path $env:GOBIN "wails.exe"
          if (-not (Test-Path -LiteralPath $wails -PathType Leaf)) { throw "Pinned Wails executable is missing." }
          $targets = @(
            [pscustomobject]@{ Platform = "windows/amd64"; Suffix = "x64"; LevelName = "GOAMD64"; LevelValue = "v1" },
            [pscustomobject]@{ Platform = "windows/386"; Suffix = "x86"; LevelName = "GO386"; LevelValue = "sse2" },
            [pscustomobject]@{ Platform = "windows/arm64"; Suffix = "arm64"; LevelName = "GOARM64"; LevelValue = "v8.0" }
          )
          $environmentNames = @("CGO_ENABLED", "GOAMD64", "GO386", "GOARM64")
          $savedEnvironment = @{}
          foreach ($name in $environmentNames) {
            $savedEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, "Process")
          }
          $artifacts = New-Object System.Collections.Generic.List[string]
          try {
            foreach ($target in $targets) {
              Remove-Item Env:\GOAMD64 -ErrorAction SilentlyContinue
              Remove-Item Env:\GO386 -ErrorAction SilentlyContinue
              Remove-Item Env:\GOARM64 -ErrorAction SilentlyContinue
              $env:CGO_ENABLED = "0"
              Set-Item -Path "Env:$($target.LevelName)" -Value $target.LevelValue
              & $wails build -platform $target.Platform -webview2 embed -trimpath -clean -skipbindings -s -nosyncgomod -m -o IrisOnlineDatabase.exe -ldflags "-buildid= -X main.appVersion=$version -X main.releaseMarker=IrisOnlineRelease/$version/$head"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $artifact = Join-Path $artifactDir "IrisOnlineDB-$version-Windows-$($target.Suffix).exe"
              Copy-Item build\bin\IrisOnlineDatabase.exe $artifact -Force
              $artifacts.Add($artifact)
            }
          } finally {
            foreach ($name in $environmentNames) {
              $value = $savedEnvironment[$name]
              if ($null -eq $value) {
                Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
              } else {
                Set-Item -Path "Env:$name" -Value $value
              }
            }
            Remove-Item build\bin, build\generated, web\wailsjs -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item build\appicon.png -Force -ErrorAction SilentlyContinue
          }
          $checksumLines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $artifact -Leaf)"
          }
          Set-Content -LiteralPath (Join-Path $artifactDir "SHA256SUMS.txt") -Value $checksumLines -Encoding ASCII
          python -B tools/verify_release_assets.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/verify_executables.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/verify_windows_resources.py --directory $artifactDir --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source tree remains clean
        shell: powershell
        run: |
          python -B tools/repository_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.Count -ne 0) {
            $status | ForEach-Object { Write-Host $_ }
            exit 1
          }
