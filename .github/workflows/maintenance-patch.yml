name: Apply maintenance patch

on:
  push:
    branches:
      - maintenance/echo-4.15.3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/echo-4.15.3
          fetch-depth: 0

      - name: Make known-source item test deterministic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app_test.go")
          text = path.read_text(encoding="utf-8")
          start_marker = "\tvar itemID int\n\tvar sourceServer, otherServer string\n"
          end_marker = "\tif itemID == 0 {\n\t\tt.Fatal(\"no server-specific known-source item found in the current data package\")\n\t}\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("start marker not found")
          end_start = text.find(end_marker, start)
          if end_start < 0:
              raise SystemExit("end marker not found")
          end = end_start + len(end_marker)
          replacement = '''\teligibleCatalogItem := func(id int) bool {
          \t\titem := store.itemsByID[id]
          \t\tif item == nil || isTitleItem(item) {
          \t\t\treturn false
          \t\t}
          \t\t_, isRecipe := store.itemRecipes[id]
          \t\treturn !isRecipe
          \t}
          \ttype sourceCandidate struct {
          \t\tid           int
          \t\tsourceServer string
          \t\totherServer  string
          \t}
          \tcandidates := make([]sourceCandidate, 0)
          \tfor id := range kiss.knownSourceItems {
          \t\tif _, ok := original.knownSourceItems[id]; ok || !eligibleCatalogItem(id) {
          \t\t\tcontinue
          \t\t}
          \t\tcandidates = append(candidates, sourceCandidate{id: id, sourceServer: "kiss", otherServer: "original"})
          \t}
          \tfor id := range original.knownSourceItems {
          \t\tif _, ok := kiss.knownSourceItems[id]; ok || !eligibleCatalogItem(id) {
          \t\t\tcontinue
          \t\t}
          \t\tcandidates = append(candidates, sourceCandidate{id: id, sourceServer: "original", otherServer: "kiss"})
          \t}
          \tsort.Slice(candidates, func(i, j int) bool {
          \t\tif candidates[i].id != candidates[j].id {
          \t\t\treturn candidates[i].id < candidates[j].id
          \t\t}
          \t\treturn candidates[i].sourceServer < candidates[j].sourceServer
          \t})
          \tif len(candidates) == 0 {
          \t\tt.Fatal("no catalog item with a server-specific known source found in the current data package")
          \t}
          \titemID := candidates[0].id
          \tsourceServer := candidates[0].sourceServer
          \totherServer := candidates[0].otherServer
          '''
          replacement = "\n".join(line.lstrip("          ") if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          updated = text[:start] + replacement + text[end:]
          if updated == text:
              raise SystemExit("patch produced no change")
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY
          rm -f .github/workflows/maintenance-patch.yml

      - name: Commit maintenance patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_test.go .github/workflows/maintenance-patch.yml
          git diff --cached --check
          git commit -m "Исправлена недетерминированная проверка источников"
          git push origin HEAD:maintenance/echo-4.15.3
