name: Apply v2.0.2 source updates

on:
  push:
    branches: [agent/fix-v2.0.2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v2.0.2-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-v2.0.2
          fetch-depth: 0
      - name: Apply requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old[:80]!r}')
              if actual == 0:
                  raise SystemExit(f'{path}: pattern not found: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          Path('VERSION').write_text('2.0.2\n', encoding='utf-8')
          replace('server.go', 'var appVersion = "2.0.1"', 'var appVersion = "2.0.2"', 1)
          replace('web/app.js', "const APP_VERSION = '2.0.1';", "const APP_VERSION = '2.0.2';", 1)
          replace('web/index.html', 'Версия 2.0.1', 'Версия 2.0.2', 2)
          replace('wails.json', '"productVersion": "2.0.1"', '"productVersion": "2.0.2"', 1)
          replace('build/windows/info.json', '"file_version": "2.0.1.0"', '"file_version": "2.0.2.0"', 1)
          replace('build/windows/info.json', '"product_version": "2.0.1.0"', '"product_version": "2.0.2.0"', 1)
          replace('build/windows/info.json', '"FileVersion": "2.0.1"', '"FileVersion": "2.0.2"', 1)
          replace('build/windows/info.json', '"ProductVersion": "2.0.1"', '"ProductVersion": "2.0.2"', 1)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('# Iris Online Database 2.0.1', '# Iris Online Database 2.0.2', 1)
          text = text.replace('Релиз v2.0.1 содержит три Windows-сборки:', 'Релиз v2.0.2 содержит три Windows-сборки:', 1)
          text = text.replace('IrisOnlineDB-2.0.1-Windows-', 'IrisOnlineDB-2.0.2-Windows-')
          text = text.replace('[Изменения v2.0.1](CHANGELOG.md)', '[Изменения v2.0.2](CHANGELOG.md)', 1)
          text = text.replace('каталоги предметов, монстров и рецептов;', 'каталоги предметов, монстров, рецептов и титулов;', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '# История изменений\n\n'
          entry = '''## 2.0.2 — 2026-08-24

### Added

- Добавлен каталог титулов из игровых ресурсов с поиском и сортировкой по индексу или названию.
- В превью титулов отображается индекс с ведущими нулями, например `005. Одиночка` и `040. Защитник лесопилки`.
- В полезные ссылки добавлен официальный Telegram: `t.me/irisonline_ru`.

### Fixed

- Кнопка «Назад» из карточки предмета, монстра или рецепта возвращает на фактическую предыдущую страницу каталога, а не на первую.
- Удалена прежняя неофициальная Telegram-ссылка.

'''
          if '## 2.0.2 — 2026-08-24' not in text:
              if not text.startswith(heading):
                  raise SystemExit('CHANGELOG heading mismatch')
              text = heading + entry + text[len(heading):]
              changelog.write_text(text, encoding='utf-8')

          replace('web/app.js', "  function defaultRecipeFilters() {\n    return { q: '', type: '', quality: '', knownSource: '', minLevel: '', maxLevel: '', sort: 'name', page: 1 };\n  }\n", "  function defaultRecipeFilters() {\n    return { q: '', type: '', quality: '', knownSource: '', minLevel: '', maxLevel: '', sort: 'name', page: 1 };\n  }\n\n  function defaultTitleFilters() {\n    return { q: '', sort: 'index', page: 1 };\n  }\n", 1)
          replace('web/app.js', "    state.recipeFilters = defaultRecipeFilters();\n", "    state.recipeFilters = defaultRecipeFilters();\n    state.titleFilters = defaultTitleFilters();\n", 1)
          replace('web/app.js', "    recipeFilters: defaultRecipeFilters(),\n", "    recipeFilters: defaultRecipeFilters(),\n    titleFilters: defaultTitleFilters(),\n    titlesData: null,\n", 1)
          replace('web/app.js', "    { route: 'recipes', label: 'Рецепты', icon: 'recipe' },\n    { route: 'favorites', label: 'Избранное', icon: 'star' },", "    { route: 'recipes', label: 'Рецепты', icon: 'recipe' },\n    { route: 'titles', label: 'Титулы', icon: 'title' },\n    { route: 'favorites', label: 'Избранное', icon: 'star' },", 1)
          replace('web/app.js', "    recipe: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h10a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2V3Z\"/><path d=\"M6 17h12M10 8h4M10 12h5\"/></svg>',\n", "    recipe: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h10a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2V3Z\"/><path d=\"M6 17h12M10 8h4M10 12h5\"/></svg>',\n    title: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"m8.5 12-1 9 4.5-2.5 4.5 2.5-1-9\"/></svg>',\n", 1)
          replace('web/app.js', "    return ['home', 'items', 'monsters', 'recipes', 'favorites', 'search'].includes(path)\n", "    return ['home', 'items', 'monsters', 'recipes', 'titles', 'favorites', 'search'].includes(path)\n", 1)

          replace('web/app.js', "  function catalogFilters(kind) {\n    if (kind === 'items') return state.itemFilters;\n    if (kind === 'recipes') return state.recipeFilters;\n    return state.monsterFilters;\n  }", "  function catalogFilters(kind) {\n    if (kind === 'items') return state.itemFilters;\n    if (kind === 'recipes') return state.recipeFilters;\n    if (kind === 'titles') return state.titleFilters;\n    return state.monsterFilters;\n  }", 1)
          replace('web/app.js', "  function catalogTitle(kind) {\n    if (kind === 'items') return 'Предметы';\n    if (kind === 'recipes') return 'Рецепты';\n    return 'Монстры';\n  }", "  function catalogTitle(kind) {\n    if (kind === 'items') return 'Предметы';\n    if (kind === 'recipes') return 'Рецепты';\n    if (kind === 'titles') return 'Титулы';\n    return 'Монстры';\n  }", 1)
          replace('web/app.js', "  function catalogRecords(kind, data) {\n    if (kind === 'items') return data.items || [];\n    if (kind === 'recipes') return data.recipes || [];\n    return data.monsters || [];\n  }", "  function catalogRecords(kind, data) {\n    if (kind === 'items') return data.items || [];\n    if (kind === 'recipes') return data.recipes || [];\n    if (kind === 'titles') return data.titles || [];\n    return data.monsters || [];\n  }", 1)
          replace('web/app.js', "    if (kind === 'recipes') return;\n", "    if (kind === 'recipes' || kind === 'titles') return;\n", 1)

          anchor = "  async function fetchCatalog(kind, signal) {\n    return api(`/api/${kind}?${buildCatalogParams(kind)}`, { signal });\n  }"
          replacement = '''  function catalogRoute(kind) {
    const filters = catalogFilters(kind);
    const params = new URLSearchParams();
    if (filters.q) params.set('q', filters.q);
    if (filters.page > 1) params.set('page', String(filters.page));
    const query = params.toString();
    return query ? `${kind}?${query}` : kind;
  }

  async function fetchTitleCatalog(signal) {
    if (!Array.isArray(state.titlesData)) {
      const payload = await api('/titles.json', { signal });
      state.titlesData = Array.isArray(payload?.titles) ? payload.titles : [];
    }
    const filters = state.titleFilters;
    const query = String(filters.q || '').trim().toLocaleLowerCase('ru-RU');
    let rows = state.titlesData.filter(record => {
      if (!query) return true;
      const searchable = `${formatTitleIndex(record.index)} ${record.index} ${record.name}`.toLocaleLowerCase('ru-RU');
      return searchable.includes(query);
    });
    rows = [...rows].sort((left, right) => {
      if (filters.sort === 'name') {
        return String(left.name || '').localeCompare(String(right.name || ''), 'ru-RU', { sensitivity: 'base' }) || Number(left.index) - Number(right.index);
      }
      return Number(left.index) - Number(right.index) || String(left.name || '').localeCompare(String(right.name || ''), 'ru-RU', { sensitivity: 'base' });
    });
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const page = Math.min(Math.max(1, Number(filters.page) || 1), pages);
    filters.page = page;
    const start = (page - 1) * PAGE_SIZE;
    return { titles: rows.slice(start, start + PAGE_SIZE), total, page, pages, filters: {} };
  }

  async function fetchCatalog(kind, signal) {
    if (kind === 'titles') return fetchTitleCatalog(signal);
    return api(`/api/${kind}?${buildCatalogParams(kind)}`, { signal });
  }'''
          replace('web/app.js', anchor, replacement, 1)

          replace('web/app.js', "      ${pageHeader(catalogTitle(kind), kind === 'items' ? 'Каталог предметов Iris Online.' : kind === 'recipes' ? 'Рецепты Iris Online и материалы для изготовления.' : 'Каталог монстров Iris Online.')}\n", "      ${pageHeader(catalogTitle(kind), kind === 'items' ? 'Каталог предметов Iris Online.' : kind === 'recipes' ? 'Рецепты Iris Online и материалы для изготовления.' : kind === 'titles' ? 'Каталог титулов Iris Online.' : 'Каталог монстров Iris Online.')}\n", 1)
          replace('web/app.js', "        <button class=\"secondary-button filter-button\" type=\"button\" data-action=\"open-filters\">${icons.filter}<span>Фильтры</span><strong data-filter-count>${activeFilterCount(kind) || ''}</strong></button>\n", "        ${kind === 'titles' ? '' : `<button class=\"secondary-button filter-button\" type=\"button\" data-action=\"open-filters\">${icons.filter}<span>Фильтры</span><strong data-filter-count>${activeFilterCount(kind) || ''}</strong></button>`}\n", 1)
          replace('web/app.js', "    renderFilterDrawer(kind, data.filters || {});\n", "    if (kind !== 'titles') renderFilterDrawer(kind, data.filters || {});\n", 1)

          replace('web/app.js', "  function sortOptions(kind, selected) {\n    const options = [", "  function sortOptions(kind, selected) {\n    if (kind === 'titles') {\n      const options = [['index', 'По индексу'], ['name', 'По названию']];\n      return options.map(([value, label]) => `<option value=\"${value}\" ${selected === value ? 'selected' : ''}>${label}</option>`).join('');\n    }\n    const options = [", 1)
          replace('web/app.js', "    return `<div class=\"result-list ${state.view === 'cards' ? 'card-view' : ''}\">${records.map(record => kind === 'items' ? itemRow(record, catalogFilters(kind).q) : kind === 'recipes' ? recipeRow(record, catalogFilters(kind).q) : monsterRow(record, catalogFilters(kind).q)).join('')}</div>`;", "    return `<div class=\"result-list ${state.view === 'cards' ? 'card-view' : ''}\">${records.map(record => kind === 'items' ? itemRow(record, catalogFilters(kind).q) : kind === 'recipes' ? recipeRow(record, catalogFilters(kind).q) : kind === 'titles' ? titleRow(record, catalogFilters(kind).q) : monsterRow(record, catalogFilters(kind).q)).join('')}</div>`;", 1)
          replace('web/app.js', "  function itemRow(item, query = '') {", "  function formatTitleIndex(value) {\n    const index = Number(value);\n    if (!Number.isInteger(index) || index < 0) return '';\n    return String(index).padStart(3, '0');\n  }\n\n  function titleRow(title, query = '') {\n    const label = `${formatTitleIndex(title.index)}. ${String(title.name || '').trim()}`;\n    return `<article class=\"result-row title-result-row\"><div class=\"result-main\"><span class=\"result-icon\">${icons.title}</span><span class=\"result-copy\"><strong>${highlight(label, query)}</strong><span class=\"result-secondary\">Индекс ${escapeHTML(title.index)}</span></span></div></article>`;\n  }\n\n  function itemRow(item, query = '') {", 1)
          replace('web/app.js', "  function activeFilterCount(kind) {\n    const filters = catalogFilters(kind);", "  function activeFilterCount(kind) {\n    if (kind === 'titles') return 0;\n    const filters = catalogFilters(kind);", 1)
          replace('web/app.js', "  function activeFilterChips(kind) {\n    const filters = catalogFilters(kind);", "  function activeFilterChips(kind) {\n    if (kind === 'titles') return '';\n    const filters = catalogFilters(kind);", 1)
          replace('web/app.js', "  function renderFilterDrawer(kind, filterData) {\n    const filters = catalogFilters(kind);", "  function renderFilterDrawer(kind, filterData) {\n    if (kind === 'titles') return;\n    const filters = catalogFilters(kind);", 1)

          replace('web/app.js', "    const catalog = state.catalog;\n    if (!catalog) return;\n", "    const catalog = state.catalog;\n    if (!catalog) return;\n    const route = catalogRoute(catalog.kind);\n    if (state.route !== route) {\n      state.route = route;\n      replaceRouteHash(route);\n    }\n", 1)
          replace('web/app.js', "    if (kind === 'monsters') state.monsterFilters = defaultMonsterFilters();\n    else if (kind === 'recipes') state.recipeFilters = defaultRecipeFilters();\n    else state.itemFilters = defaultItemFilters();", "    if (kind === 'monsters') state.monsterFilters = defaultMonsterFilters();\n    else if (kind === 'recipes') state.recipeFilters = defaultRecipeFilters();\n    else if (kind === 'titles') state.titleFilters = defaultTitleFilters();\n    else state.itemFilters = defaultItemFilters();", 1)

          replace('web/app.js', "    const preserveCatalogPage = Boolean(visibleCatalog && ['items', 'monsters', 'recipes'].includes(targetPath));", "    const preserveCatalogPage = Boolean(visibleCatalog && ['items', 'monsters', 'recipes', 'titles'].includes(targetPath));", 1)
          replace('web/app.js', "      else if (path === 'items' || path === 'monsters' || path === 'recipes') {\n        const filters = catalogFilters(path);\n        if (params.has('q')) filters.q = params.get('q') || '';\n        filters.page = 1;", "      else if (path === 'items' || path === 'monsters' || path === 'recipes' || path === 'titles') {\n        const filters = catalogFilters(path);\n        if (params.has('q')) filters.q = params.get('q') || '';\n        const routePage = Number.parseInt(params.get('page') || '1', 10);\n        filters.page = Number.isFinite(routePage) && routePage > 0 ? routePage : 1;", 1)
          replace('web/app.js', "    normalizeDependentFilters('recipes');\n", "    normalizeDependentFilters('recipes');\n    normalizeDependentFilters('titles');\n", 1)

          replace('web/app.js', "        <a href=\"https://vk.ru/board59626511\" target=\"_blank\" rel=\"noopener noreferrer external\"><strong>Обсуждения</strong><small>vk.ru</small></a>\n        <a href=\"https://github.com/fsibatov/iris-online-database\"", "        <a href=\"https://vk.ru/board59626511\" target=\"_blank\" rel=\"noopener noreferrer external\"><strong>Обсуждения</strong><small>vk.ru</small></a>\n        <a href=\"https://t.me/irisonline_ru\" target=\"_blank\" rel=\"noopener noreferrer external\"><strong>Telegram</strong><small>t.me/irisonline_ru</small></a>\n        <a href=\"https://github.com/fsibatov/iris-online-database\"", 1)
          replace('web/app.js', "        <a href=\"https://t.me/joinchat/IZdJ2hPIDvgj-ythC-NvTQ\" target=\"_blank\" rel=\"noopener noreferrer external\">Telegram</a>\n", "", 1)

          replace('web/styles.css', 'grid-template-columns: repeat(5, minmax(0, 1fr));', 'grid-template-columns: repeat(6, minmax(0, 1fr));', 1)
          Path('web/styles.css').write_text(Path('web/styles.css').read_text(encoding='utf-8') + '\n.title-result-row { grid-template-columns: minmax(0, 1fr); }\n.title-result-row .result-main { cursor: default; }\n', encoding='utf-8')
          PY
      - name: Validate source
        shell: bash
        run: |
          node --check web/app.js
          python -m unittest discover -s tests -p 'test_release_helpers.py'
          go test ./...
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION server.go web/app.js web/index.html web/styles.css web/titles.json wails.json build/windows/info.json README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: complete v2.0.2 catalog updates [v2.0.2-patched]"
          git push origin HEAD:agent/fix-v2.0.2
