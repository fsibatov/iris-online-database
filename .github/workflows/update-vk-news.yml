name: Обновление последней записи VK

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: update-vk-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Установить Playwright
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-audit.txt
          python -m playwright install --with-deps chromium

      - name: Получить последнюю запись VK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "VK update attempt ${attempt}/3"
            if python tools/update_vk_news.py --output data/latest-vk.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::VK update failed after 3 attempts."
          exit 1

      - name: Сохранить изменение
        shell: bash
        run: |
          if git diff --quiet -- data/latest-vk.json; then
            echo "Новых записей нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-vk.json
          git commit -m "Обновлена последняя запись VK"
          git push
