name: Обновление последней записи VK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-vk-news.yml'
      - 'tools/update_vk_news.py'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: update-vk-news-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Настроить Playwright и системный Chrome
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m python -m pip install --disable-pip-version-check -r tools/requirements-audit.txt
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          expected = next(
              line.split("==", 1)[1]
              for line in Path("tools/requirements-audit.txt").read_text().splitlines()
              if line.startswith("playwright==")
          )
          actual = importlib.metadata.version("playwright")
          if actual != expected:
              raise SystemExit("Playwright version does not match requirements-audit.txt")
          PY

          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "::error::System Chrome/Chromium was not found on the GitHub runner."
            exit 1
          fi

          "$chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"

      - name: Получить последнюю запись VK
        shell: bash
        run: |
          set -euo pipefail
          transient_failure=0
          stale_confirmations=0
          stale_candidate_id=""

          for attempt in 1 2 3; do
            echo "VK update attempt ${attempt}/3"
            candidate_file="$RUNNER_TEMP/vk-candidate-${attempt}.json"
            rm -f -- "$candidate_file"

            set +e
            output="$(timeout 3m python -B tools/update_vk_news.py --output "$candidate_file" 2>&1)"
            exit_code=$?
            set -e
            printf '%s\n' "$output"

            if [ "$exit_code" -ne 0 ]; then
              category="$(printf '%s\n' "$output" | sed -n 's/.*Ошибка обновления VK \[\([^]]*\)\].*/\1/p' | tail -n 1)"
              transient_failure=0

              if [ "$exit_code" -eq 124 ]; then
                category="TIMEOUT"
                transient_failure=1
              else
                case "$category" in
                  EMPTY_PREVIEW|VK_UNAVAILABLE|BROWSER_*)
                    transient_failure=1
                    ;;
                  *)
                    echo "::error::VK updater failed with non-transient category: ${category:-UNKNOWN} (exit ${exit_code})."
                    exit "$exit_code"
                    ;;
                esac
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "VK transient failure [${category}], retrying."
                sleep $((attempt * 10))
              fi
              continue
            fi

            if [ ! -f "$candidate_file" ]; then
              echo "::error::VK updater succeeded without producing a candidate payload."
              exit 1
            fi

            if ! candidate_state="$(python - data/latest-vk.json "$candidate_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          current_path = Path(sys.argv[1])
          candidate_path = Path(sys.argv[2])
          current = json.loads(current_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          def validate(payload):
              post_id = payload.get("post_id")
              post_url = payload.get("post_url")
              text = str(payload.get("text") or "").strip()
              if not isinstance(post_id, int) or isinstance(post_id, bool) or post_id <= 0:
                  raise SystemExit(2)
              if post_url != f"https://vk.ru/wall-59626511_{post_id}":
                  raise SystemExit(3)
              if not text:
                  raise SystemExit(4)
              return post_id

          current_id = validate(current)
          candidate_id = validate(candidate)
          comparable_keys = (
              "schema",
              "community_url",
              "post_id",
              "post_url",
              "text",
              "published_at",
          )

          if candidate_id < current_id:
              action = "stale"
          elif candidate_id > current_id:
              action = "promote"
          elif all(current.get(key, "") == candidate.get(key, "") for key in comparable_keys):
              action = "same"
          else:
              action = "promote"

          print(candidate_id, action)
          PY
          )"; then
              echo "::error::VK candidate/current JSON validation failed."
              exit 1
            fi

            candidate_id="${candidate_state%% *}"
            candidate_action="${candidate_state#* }"
            transient_failure=0

            case "$candidate_action" in
              same)
                echo "VK: без изменений, последняя запись #${candidate_id}"
                exit 0
                ;;
              promote)
                cp -- "$candidate_file" data/latest-vk.json
                echo "VK: подтверждена актуальная запись #${candidate_id}"
                exit 0
                ;;
              stale)
                if [ -z "$stale_candidate_id" ]; then
                  stale_candidate_id="$candidate_id"
                  stale_confirmations=1
                elif [ "$candidate_id" = "$stale_candidate_id" ]; then
                  stale_confirmations=$((stale_confirmations + 1))
                else
                  echo "::warning::VK lower-ID candidate changed from #${stale_candidate_id} to #${candidate_id}; confirmation counter reset."
                  stale_candidate_id="$candidate_id"
                  stale_confirmations=1
                fi

                echo "VK lower-ID candidate #${candidate_id} confirmed ${stale_confirmations}/3."
                if [ "$stale_confirmations" -eq 3 ]; then
                  cp -- "$candidate_file" data/latest-vk.json
                  echo "::notice::VK previous last-known-good post is no longer current. Public post #${candidate_id} promoted after 3 independent confirmations."
                  exit 0
                fi
                ;;
              *)
                echo "::error::Unexpected VK candidate action: ${candidate_action}."
                exit 1
                ;;
            esac

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          if [ "$stale_confirmations" -gt 0 ]; then
            echo "::warning::Lower-ID VK candidate was not confirmed 3 times. Last-known-good data is preserved."
            exit 0
          fi

          if [ "$transient_failure" -eq 1 ]; then
            echo "::warning::VK is temporarily unavailable or the newest public preview cannot be extracted. Last-known-good data is preserved."
            exit 0
          fi

          echo "::error::VK updater ended in an unexpected state."
          exit 1

      - name: Сохранить изменение
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/latest-vk.json; then
            echo "Новых записей нет."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-vk.json
          git commit -m "Обновлена последняя запись VK"

          for push_attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$push_attempt" -eq 3 ]; then
              echo "::error::Failed to push VK update after 3 synchronized attempts."
              exit 1
            fi
            sleep $((push_attempt * 5))
          done
