name: Обновление последней записи VK

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: update-vk-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Настроить Playwright и системный Chrome
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m python -m pip install --disable-pip-version-check -r tools/requirements-audit.txt
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          expected = next(
              line.split("==", 1)[1]
              for line in Path("tools/requirements-audit.txt").read_text().splitlines()
              if line.startswith("playwright==")
          )
          actual = importlib.metadata.version("playwright")
          if actual != expected:
              raise SystemExit("Playwright version does not match requirements-audit.txt")
          PY

          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "::error::System Chrome/Chromium was not found on the GitHub runner."
            exit 1
          fi

          "$chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"

      - name: Получить последнюю запись VK
        shell: bash
        run: |
          set -euo pipefail
          transient_failure=0
          stale_confirmations=0
          stale_candidate_id=""
          stale_candidate_file=""

          for attempt in 1 2 3; do
            echo "VK update attempt ${attempt}/3"

            set +e
            output="$(timeout 3m python -B tools/update_vk_news.py --output data/latest-vk.json 2>&1)"
            exit_code=$?
            set -e
            printf '%s\n' "$output"

            if [ "$exit_code" -eq 0 ]; then
              exit 0
            fi

            category="$(printf '%s\n' "$output" | sed -n 's/.*Ошибка обновления VK \[\([^]]*\)\].*/\1/p' | tail -n 1)"
            transient_failure=0

            if [ "$exit_code" -eq 124 ]; then
              category="TIMEOUT"
              transient_failure=1
            else
              case "$category" in
                STALE_POST)
                  transient_failure=1
                  candidate_file="$RUNNER_TEMP/vk-stale-candidate-${attempt}.json"
                  rm -f -- "$candidate_file"

                  set +e
                  candidate_output="$(timeout 3m python -B tools/update_vk_news.py --output "$candidate_file" 2>&1)"
                  candidate_exit=$?
                  set -e
                  printf '%s\n' "$candidate_output"

                  if [ "$candidate_exit" -eq 0 ] && [ -f "$candidate_file" ]; then
                    if candidate_id="$(python - "$candidate_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          post_id = payload.get("post_id")
          post_url = payload.get("post_url")
          text = str(payload.get("text") or "").strip()
          if not isinstance(post_id, int) or isinstance(post_id, bool) or post_id <= 0:
              raise SystemExit(2)
          if post_url != f"https://vk.ru/wall-59626511_{post_id}":
              raise SystemExit(3)
          if not text:
              raise SystemExit(4)
          print(post_id)
          PY
          )"; then
                      if [ -z "$stale_candidate_id" ]; then
                        stale_candidate_id="$candidate_id"
                        stale_confirmations=1
                      elif [ "$candidate_id" = "$stale_candidate_id" ]; then
                        stale_confirmations=$((stale_confirmations + 1))
                      else
                        echo "::warning::VK stale candidate changed from #${stale_candidate_id} to #${candidate_id}; confirmation counter reset."
                        stale_candidate_id="$candidate_id"
                        stale_confirmations=1
                      fi
                      stale_candidate_file="$candidate_file"
                      echo "VK stale candidate #${candidate_id} confirmed ${stale_confirmations}/3."
                    else
                      echo "::warning::VK stale candidate JSON failed validation."
                    fi
                  else
                    echo "::warning::VK stale candidate could not be collected (exit ${candidate_exit})."
                  fi
                  ;;
                EMPTY_PREVIEW|VK_UNAVAILABLE|BROWSER_*)
                  transient_failure=1
                  ;;
                *)
                  echo "::error::VK updater failed with non-transient category: ${category:-UNKNOWN} (exit ${exit_code})."
                  exit "$exit_code"
                  ;;
              esac
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "VK transient failure [${category}], retrying."
              sleep $((attempt * 10))
            fi
          done

          if [ "$stale_confirmations" -eq 3 ] && [ -n "$stale_candidate_file" ]; then
            cp -- "$stale_candidate_file" data/latest-vk.json
            echo "::notice::VK previous last-known-good post is stale. Consistently observed public post #${stale_candidate_id} promoted after 3 independent confirmations."
            exit 0
          fi

          if [ "$transient_failure" -eq 1 ]; then
            echo "::warning::VK is temporarily unavailable or the newest public preview cannot be extracted. Last-known-good data is preserved."
            exit 0
          fi

          echo "::error::VK updater ended in an unexpected state."
          exit 1

      - name: Сохранить изменение
        shell: bash
        run: |
          if git diff --quiet -- data/latest-vk.json; then
            echo "Новых записей нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-vk.json
          git commit -m "Обновлена последняя запись VK"
          git push
