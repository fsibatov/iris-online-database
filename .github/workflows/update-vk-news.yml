name: Обновление последней записи VK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-vk-news.yml'
      - 'tools/update_vk_news.py'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: update-vk-news-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Настроить Playwright и системный Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --disable-pip-version-check --timeout 60 --retries 3 -r tools\requirements-audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -B tools\verify_python_environment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ChromeCandidates = New-Object System.Collections.Generic.List[string]
          if ($env:ProgramFiles) {
            $ChromeCandidates.Add((Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"))
          }
          if (${env:ProgramFiles(x86)}) {
            $ChromeCandidates.Add((Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"))
          }

          $Chrome = $ChromeCandidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1

          if (-not $Chrome) {
            $ChromeCommand = Get-Command chrome.exe -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($ChromeCommand) { $Chrome = $ChromeCommand.Source }
          }

          if (-not $Chrome) {
            throw "System Chrome was not found on the Windows runner."
          }

          & $Chrome --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$Chrome" + [Environment]::NewLine,
            $Utf8NoBom
          )

      - name: Получить последнюю запись VK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $TransientFailure = $false
          $StaleConfirmations = 0
          $StaleCandidateId = $null

          $ValidatorPath = Join-Path $env:RUNNER_TEMP "vk-candidate-state.py"
          $ValidatorSource = @'
          import html
          import json
          import re
          import sys
          from pathlib import Path

          current_path = Path(sys.argv[1])
          candidate_path = Path(sys.argv[2])
          current = json.loads(current_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          BR_TAG = re.compile(r"<br\s*/?>", re.IGNORECASE)
          HTML_TAG = re.compile(r"<[^>]+>")
          DECORATIVE_SYMBOL = re.compile(
              "[\u2600-\u27BF\U0001F300-\U0001FAFF\uFE0F\u200D]"
          )
          MARKUP = re.compile(r"[*_`~]+")

          def validate(payload):
              post_id = payload.get("post_id")
              post_url = payload.get("post_url")
              text = str(payload.get("text") or "").strip()
              if not isinstance(post_id, int) or isinstance(post_id, bool) or post_id <= 0:
                  raise SystemExit(2)
              if post_url != f"https://vk.ru/wall-59626511_{post_id}":
                  raise SystemExit(3)
              if not text:
                  raise SystemExit(4)
              return post_id

          def semantic_text(value):
              text = BR_TAG.sub("\n", str(value or ""))
              text = HTML_TAG.sub(" ", html.unescape(text))
              text = DECORATIVE_SYMBOL.sub("", text)
              text = MARKUP.sub("", text)
              return " ".join(text.split()).casefold()

          current_id = validate(current)
          candidate_id = validate(candidate)
          identity_keys = (
              "schema",
              "community_url",
              "post_id",
              "post_url",
              "published_at",
          )

          same_identity = all(
              current.get(key, "") == candidate.get(key, "") for key in identity_keys
          )
          same_text = semantic_text(current.get("text")) == semantic_text(
              candidate.get("text")
          )

          if candidate_id < current_id:
              action = "stale"
          elif candidate_id > current_id:
              action = "promote"
          elif same_identity and same_text:
              action = "same"
          else:
              action = "promote"

          print(candidate_id, action)
          '@
          [IO.File]::WriteAllText($ValidatorPath, $ValidatorSource, $Utf8NoBom)

          function Invoke-VkUpdater {
            param(
              [Parameter(Mandatory = $true)][string]$CandidateFile,
              [int]$TimeoutSeconds = 180
            )

            $PythonCommand = Get-Command python.exe -CommandType Application -ErrorAction Stop |
              Select-Object -First 1
            $StartInfo = New-Object System.Diagnostics.ProcessStartInfo
            $StartInfo.FileName = $PythonCommand.Source
            $StartInfo.Arguments = '-B tools\update_vk_news.py --output "' + $CandidateFile + '"'
            $StartInfo.WorkingDirectory = $env:GITHUB_WORKSPACE
            $StartInfo.UseShellExecute = $false
            $StartInfo.CreateNoWindow = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $StartInfo.StandardOutputEncoding = [Text.Encoding]::UTF8
            $StartInfo.StandardErrorEncoding = [Text.Encoding]::UTF8
            $StartInfo.EnvironmentVariables["PYTHONIOENCODING"] = "utf-8"
            $StartInfo.EnvironmentVariables["PYTHONUTF8"] = "1"

            $Process = New-Object System.Diagnostics.Process
            $Process.StartInfo = $StartInfo
            try {
              if (-not $Process.Start()) {
                throw "VK updater process did not start."
              }
              $StdoutTask = $Process.StandardOutput.ReadToEndAsync()
              $StderrTask = $Process.StandardError.ReadToEndAsync()
              $TimedOut = -not $Process.WaitForExit($TimeoutSeconds * 1000)
              if ($TimedOut) {
                $Taskkill = Join-Path $env:SystemRoot "System32\taskkill.exe"
                if (Test-Path -LiteralPath $Taskkill -PathType Leaf) {
                  & $Taskkill /PID $Process.Id /T /F *> $null
                }
                if (-not $Process.HasExited) { $Process.Kill() }
              }
              [void]$Process.WaitForExit()
              $ExitCode = if ($TimedOut) { -1 } else { $Process.ExitCode }
              return [pscustomobject]@{
                TimedOut = $TimedOut
                ExitCode = $ExitCode
                Stdout = [string]$StdoutTask.GetAwaiter().GetResult()
                Stderr = [string]$StderrTask.GetAwaiter().GetResult()
              }
            } finally {
              $Process.Dispose()
            }
          }

          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            Write-Host "VK update attempt $Attempt/3"
            $CandidateFile = Join-Path $env:RUNNER_TEMP "vk-candidate-$Attempt.json"
            Remove-Item -LiteralPath $CandidateFile -Force -ErrorAction SilentlyContinue

            $Result = Invoke-VkUpdater -CandidateFile $CandidateFile
            $Output = (([string]$Result.Stdout) + [Environment]::NewLine + ([string]$Result.Stderr)).Trim()
            if ($Output) { Write-Host $Output }

            if ($Result.TimedOut -or $Result.ExitCode -ne 0) {
              $Category = ""
              $TransientFailure = $false

              if ($Result.TimedOut) {
                $Category = "TIMEOUT"
                $TransientFailure = $true
              } else {
                $CategoryMatch = [Regex]::Match(
                  [string]$Result.Stderr,
                  '\[([A-Z][A-Z0-9_:.-]*)\]',
                  [Text.RegularExpressions.RegexOptions]::CultureInvariant
                )
                if ($CategoryMatch.Success) {
                  $Category = $CategoryMatch.Groups[1].Value
                }

                if (
                  $Category -eq "EMPTY_PREVIEW" -or
                  $Category -eq "VK_UNAVAILABLE" -or
                  $Category -like "BROWSER_*"
                ) {
                  $TransientFailure = $true
                } else {
                  $CategoryLabel = if ($Category) { $Category } else { "UNKNOWN" }
                  Write-Host "::error::VK updater failed with non-transient category: $CategoryLabel (exit $($Result.ExitCode))."
                  exit $Result.ExitCode
                }
              }

              if ($Attempt -lt 3) {
                Write-Host "VK transient failure [$Category], retrying."
                Start-Sleep -Seconds ($Attempt * 10)
              }
              continue
            }

            if (-not (Test-Path -LiteralPath $CandidateFile -PathType Leaf)) {
              throw "VK updater succeeded without producing a candidate payload."
            }

            $CandidateStateOutput = & python $ValidatorPath "data\latest-vk.json" $CandidateFile 2>&1
            $CandidateStateExit = $LASTEXITCODE
            $CandidateState = (($CandidateStateOutput | Out-String).Trim())
            if ($CandidateStateExit -ne 0) {
              Write-Host "::error::VK candidate/current JSON validation failed."
              exit 1
            }

            if ($CandidateState -notmatch '^([0-9]+)\s+(same|promote|stale)$') {
              throw "Unexpected VK candidate state: $CandidateState"
            }

            $CandidateId = [int64]$Matches[1]
            $CandidateAction = $Matches[2]
            $TransientFailure = $false

            switch ($CandidateAction) {
              "same" {
                Write-Host "VK: без изменений, последняя запись #$CandidateId"
                exit 0
              }
              "promote" {
                Copy-Item -LiteralPath $CandidateFile -Destination "data\latest-vk.json" -Force
                Write-Host "VK: подтверждена актуальная запись #$CandidateId"
                exit 0
              }
              "stale" {
                if ($null -eq $StaleCandidateId) {
                  $StaleCandidateId = $CandidateId
                  $StaleConfirmations = 1
                } elseif ($CandidateId -eq $StaleCandidateId) {
                  $StaleConfirmations++
                } else {
                  Write-Host "::warning::VK lower-ID candidate changed from #$StaleCandidateId to #$CandidateId; confirmation counter reset."
                  $StaleCandidateId = $CandidateId
                  $StaleConfirmations = 1
                }

                Write-Host "VK lower-ID candidate #$CandidateId confirmed $StaleConfirmations/3."
                if ($StaleConfirmations -eq 3) {
                  Copy-Item -LiteralPath $CandidateFile -Destination "data\latest-vk.json" -Force
                  Write-Host "::notice::VK previous last-known-good post is no longer current. Public post #$CandidateId promoted after 3 independent confirmations."
                  exit 0
                }
              }
              default {
                throw "Unexpected VK candidate action: $CandidateAction"
              }
            }

            if ($Attempt -lt 3) {
              Start-Sleep -Seconds ($Attempt * 10)
            }
          }

          if ($StaleConfirmations -gt 0) {
            Write-Host "::warning::Lower-ID VK candidate was not confirmed 3 times. Last-known-good data is preserved."
            exit 0
          }

          if ($TransientFailure) {
            Write-Host "::warning::VK is temporarily unavailable or the newest public preview cannot be extracted. Last-known-good data is preserved."
            exit 0
          }

          throw "VK updater ended in an unexpected state."

      - name: Сохранить изменение
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & git diff --quiet -- data/latest-vk.json
          $DiffExit = $LASTEXITCODE
          if ($DiffExit -eq 0) {
            Write-Host "Новых записей нет."
            exit 0
          }
          if ($DiffExit -ne 1) {
            throw "git diff failed with exit code $DiffExit."
          }

          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git add -- data/latest-vk.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -c commit.gpgSign=false commit -m "Обновлена последняя запись VK"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          for ($PushAttempt = 1; $PushAttempt -le 3; $PushAttempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch origin/main."
            }

            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw "Failed to rebase VK update onto origin/main."
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($PushAttempt -eq 3) {
              throw "Failed to push VK update after 3 synchronized attempts."
            }

            Start-Sleep -Seconds ($PushAttempt * 5)
          }
