name: Dependency Review

on:
  pull_request:

permissions:
  contents: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply focused product patch
        if: github.event.pull_request.head.ref == 'agent/performance-dedup-quality'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/_apply_product_patch.py ]; then
            echo 'Product patch already applied.'
            exit 0
          fi
          mkdir -p tests
          : > tests/test_quality_contract.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/_apply_product_patch.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('workflow_path = ROOT / ".github" / "workflows" / "update-vk-news.yml"')
          end = text.index('# Temporary transport files must never survive in the product diff.', start)
          text = text[:start] + text[end:]
          text = text.replace(
              'run("git", "checkout", "origin/main", "--", ".github/workflows/dependency-review.yml")\n',
              '',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -B tools/_apply_product_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: убрать флик, дублирование и лишний шум"
          git push origin HEAD:agent/performance-dedup-quality
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
