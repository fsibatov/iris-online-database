name: Dependency Review

on:
  pull_request:

permissions:
  contents: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply update endpoint test fix
        if: github.event.pull_request.head.ref == 'agent/release-v2.0.1'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/_fix_update_endpoint_test.py ]; then
            echo 'Update endpoint test fix already applied.'
            exit 0
          fi
          python -B tools/_fix_update_endpoint_test.py
          gofmt -w update_check_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: отвязать update endpoint от номера релиза"
          git push origin HEAD:agent/release-v2.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
