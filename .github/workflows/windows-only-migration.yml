name: Apply Windows-only release migration

on:
  push:
    branches: ['agent/windows-only-release-pipeline']

permissions:
  contents: write

jobs:
  migrate:
    name: Apply guarded migration
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt

      - name: Setup pinned Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Apply guarded source migration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          path = Path("tools/windows_only_migration.py")
          source = path.read_text(encoding="utf-8")
          old = '''def replace_exact(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
          '''
          new = '''def replace_exact(path: str, old: str, new: str) -> None:
              text = read(path)
              old = old.replace("\\\\n", "\\n")
              new = new.replace("\\\\n", "\\n")
              count = text.count(old)
          '''
          if source.count(old) != 1:
              raise SystemExit("migration bootstrap anchor mismatch")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools\windows_only_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format and validate changed sources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --requirement tools\requirements-audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = (Resolve-Path -LiteralPath .\tools).Path
          $env:PYTHONPYCACHEPREFIX = Join-Path $env:RUNNER_TEMP "migration-pycache"
          python -m ruff format --no-cache .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check --no-cache .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools\validate_workflows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web\app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gofmtOutput = $null

      - name: Validate Go and PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $goFiles = Get-ChildItem -LiteralPath . -Filter '*.go' -File | Select-Object -ExpandProperty FullName
          $unformatted = @(& gofmt -l -- $goFiles)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) {
            $unformatted | ForEach-Object { Write-Host $_ }
            throw "Go source is not formatted."
          }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('IrisTools.ps1', 'scripts\windows\IrisTools.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_ }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Remove one-shot migration machinery and verify hygiene
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git rm -- .github/workflows/windows-only-migration.yml tools/windows_only_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPYCACHEPREFIX = Join-Path $env:RUNNER_TEMP "final-audit-pycache"
          python -B tools\repository_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath scripts\release-gate.sh -PathType Leaf) { throw "release-gate.sh remains" }
          if (Test-Path -LiteralPath scripts\build-release.sh -PathType Leaf) { throw "build-release.sh remains" }
          if (Test-Path -LiteralPath scripts\release-tools.sh -PathType Leaf) { throw "release-tools.sh remains" }

      - name: Commit migrated Windows-only pipeline
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.filemode false
          git add --renormalize .
          git add -A
          git status --short
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "refactor: make release pipeline Windows-only"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/windows-only-release-pipeline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
